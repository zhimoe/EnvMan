[package]
name = "envman"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.14", features = ["tokio"] }

[target.'cfg(windows)'.dependencies]
windows = { version = ">=0.59, <=0.62", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_System_Threading",
] }
winreg = "0.55"

tokio = { version = "1", features = ["full"] }
thiserror = "2"
anyhow = "1"

[build-dependencies]
winres = "0.1"
